    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".55" stop-color="#8f7dff"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8f7dff" stop-opacity="0"/></radialGradient>
