<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Makiease</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section class="editor">
      <div class="canvas-wrap">
        <canvas id="curve"></canvas>
      </div>
      <div class="row">
        <input id="values" class="values" spellcheck="false" autocomplete="off" title="x1, y1, x2, y2 — можно вписать вручную">
        <button id="save" class="icon" title="Сохранить в «Мои»">
          <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        </button>
      </div>
      <div class="row">
        <button id="read" class="icon" title="Взять кривую с выделенных ключей">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.5"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg>
        </button>
        <div class="seg" id="mode" role="radiogroup" title="К какой стороне ключей применять">
          <button data-mode="in">In</button>
          <button data-mode="both" class="on">In · Out</button>
          <button data-mode="out">Out</button>
        </div>
      </div>
      <button id="apply" class="apply">Применить</button>
    </section>

    <section class="library">
      <div class="tabs">
        <button data-tab="builtin" class="on">Пресеты</button>
        <button data-tab="saved">Мои</button>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="js/presets.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
